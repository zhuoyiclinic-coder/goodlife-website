<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<!-- 分享預覽圖的原稿：node scripts/make-og.cjs 會把這頁截成 public/og.png（1200×630） -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #F4F8FC; color: #0B2B57; position: relative; overflow: hidden; }
  .glow { position: absolute; inset: 0; background: radial-gradient(45% 60% at 85% 20%, rgba(22,139,255,.22), transparent 70%), radial-gradient(40% 55% at 95% 95%, rgba(25,199,190,.22), transparent 70%); }
  .wrap { position: relative; padding: 72px 80px; height: 100%; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo img { width: 64px; height: 64px; }
  .logo b { font-size: 44px; letter-spacing: -1px; }
  .logo span { font-size: 26px; color: #6F7B8C; font-weight: 500; }
  .bar { width: 88px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #168BFF, #19C7BE 60%, #76D54E); margin: 64px 0 28px; }
  h1 { font-size: 66px; line-height: 1.25; font-weight: 700; letter-spacing: 1px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #0F6FD6, #0B8C86); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 24px; font-size: 28px; color: #3D4B5F; font-weight: 500; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #6F7B8C; }
  .foot b { color: #0F6FD6; font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="logo"><img src="../public/brand/icon.svg" alt="" /><b>GoodLife</b><span>好境全方位診所營運系統</span></div>
    <div class="bar"></div>
    <h1>從預約到月結，<br />一套系統跑完<em>整間醫美診所</em></h1>
    <p class="sub">預約・結帳・電子發票・套票儲值金・傳票・抽成薪資・庫存・報表</p>
    <div class="foot"><span>按診所計價，員工帳號不限人數</span><b>goodlife-clinic.tw</b></div>
  </div>
</body>
</html>
